# Сборка установщика Windows и APK для Android, релиз на GitHub — файлы платформ в одном релизе.
#   Тег vX.Y.Z (версия = package.json) → установщик и APK собираются параллельно и выкладываются в один релиз; текст
#   релиза — сообщение аннотированного тега (git tag -a v1.4.0 -F notes.md).
#   Строка «Платформы: android» (или «windows») в тексте тега — релиз только для этой платформы: другая не собирается,
#   её файлов в релизе нет, и её приложение обновления не увидит (ищет последний релиз со своим файлом). Без строки — обе.
#   Вручную (Actions → Release → Run workflow) → только сборка: установщик и APK в артефактах запуска, релиз не создаётся.
#   Вместе с установщиком в релиз идут latest.yml и .blockmap, вместе с APK — ничего: по ним и по Anix-X.Y.Z.apk
#   приложения на ПК и на телефоне находят обновление.
# Ключи источников, соцвхода и Discord (config.local.json) — из секрета CONFIG_LOCAL_JSON, в репозитории их нет.
# Все секреты (и ключ подписи Android) — копией в приватном arigandores/anix-secrets, там же sync-secrets.sh.
# anix-trt.exe (ускорение NVIDIA) собирается с CUDA Toolkit только при изменении trt/, иначе берётся из кэша.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # создать релиз

concurrency:
  group: release-${{ github.ref }}

jobs:
  # Какие платформы выпускать — из строки «Платформы: …» в тексте тега (docs/RELEASE.md); вручную — обе
  plan:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.p.outputs.windows }}
      android: ${{ steps.p.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        shell: bash
        run: |
          line=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            # без строки «Платформы» grep ничего не находит (код 1) — с pipefail это валило шаг; || true — обе платформы
            line=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | grep -iE '^\s*(Платформы|Platforms)\s*:' | head -1 | tr '[:upper:]' '[:lower:]' || true)
          fi
          win=true; and=true
          if [ -n "$line" ]; then
            echo "$line" | grep -qE 'windows|win' && win=true || win=false
            echo "$line" | grep -qE 'android' && and=true || and=false
            if [ "$win" = false ] && [ "$and" = false ]; then echo "::error::«$line» — нет ни windows, ни android"; exit 1; fi
          fi
          echo "windows=$win" >> "$GITHUB_OUTPUT"; echo "android=$and" >> "$GITHUB_OUTPUT"
          echo "Платформы: windows=$win, android=$and"

  build:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2022 # Visual Studio 2022: nvcc CUDA 13.1 не принимает VS 2026 из windows-2025
    timeout-minutes: 75
    env:
      CUDA_VERSION: '13.1.1' # как у локальной сборки; SDK TensorRT for RTX — из trt/build.js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Версия тега совпадает с package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$v" ]; then echo "::error::Тег $GITHUB_REF_NAME, а в package.json версия $v"; exit 1; fi

      - run: npm ci

      # новые npm не запускают install-скрипты зависимостей: бинарник Electron скачиваем сами
      - name: Electron
        run: node node_modules/electron/install.js

      - name: Кэш anix-trt.exe
        id: trt
        uses: actions/cache@v4
        with:
          path: trt/bin/anix-trt.exe
          key: anix-trt-cuda${{ env.CUDA_VERSION }}-${{ runner.os }}-${{ hashFiles('trt/anix-trt.cu', 'trt/build.js') }}

      - name: CUDA Toolkit (только если trt/ изменился)
        if: steps.trt.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: local

      - name: Сборка anix-trt.exe
        if: steps.trt.outputs.cache-hit != 'true'
        run: node trt/build.js

      - name: Ключи из секрета CONFIG_LOCAL_JSON
        shell: pwsh
        env:
          CONFIG_LOCAL_JSON: ${{ secrets.CONFIG_LOCAL_JSON }}
        run: |
          if (-not $env:CONFIG_LOCAL_JSON) {
            if ($env:GITHUB_REF -like 'refs/tags/*') { Write-Output '::error::Нет секрета CONFIG_LOCAL_JSON — релиз без ключей не выпускаем'; exit 1 }
            Write-Output '::warning::Нет секрета CONFIG_LOCAL_JSON — сборка без ключей'; exit 0
          }
          try { $null = $env:CONFIG_LOCAL_JSON | ConvertFrom-Json } catch { Write-Output '::error::CONFIG_LOCAL_JSON — не JSON'; exit 1 }
          [IO.File]::WriteAllText("$PWD/config.local.json", $env:CONFIG_LOCAL_JSON)

      - name: Сборка установщика
        run: npm run build:release

      - uses: actions/upload-artifact@v4
        with:
          name: Anix-Windows
          path: |
            release/Anix-Setup-*.exe
            release/Anix-Setup-*.exe.blockmap
            release/latest.yml
          retention-days: 14


  # Android: подписанный APK — параллельно со сборкой для Windows (docs/TECHNICAL.md → «Android»).
  # Ключ подписи — секреты ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
  # (копия — в приватном arigandores/anix-secrets). Другой ключ — и новая версия не встанет поверх установленной.
  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3 # SDK; платформу compileSdk Gradle докачает сам
        with:
          packages: platform-tools # по умолчанию ещё и 'tools' — его убрали из репозитория SDK, sdkmanager падал
          log-accepted-android-sdk-licenses: false

      - name: Ключи из секрета CONFIG_LOCAL_JSON
        env:
          CONFIG_LOCAL_JSON: ${{ secrets.CONFIG_LOCAL_JSON }}
        run: |
          if [ -z "$CONFIG_LOCAL_JSON" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "::error::Нет секрета CONFIG_LOCAL_JSON — релиз без ключей не выпускаем"; exit 1; fi
            echo "::warning::Нет секрета CONFIG_LOCAL_JSON — сборка без ключей"; exit 0
          fi
          printf '%s' "$CONFIG_LOCAL_JSON" > config.local.json
          node -e "JSON.parse(require('fs').readFileSync('config.local.json','utf8'))"

      - name: Ключ подписи
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64 — APK для релиза не подписать"; exit 1; fi
            echo "::warning::Нет ключа подписи — APK подписан отладочным ключом"; exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > android/release.keystore
          { echo "ANIX_KEYSTORE=release.keystore"; echo "ANIX_KEYSTORE_PASSWORD=$STORE_PW"; echo "ANIX_KEY_ALIAS=$KEY_ALIAS"; echo "ANIX_KEY_PASSWORD=$KEY_PW"; } >> "$GITHUB_ENV"

      - name: Сборка APK
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --no-daemon)
          v=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "Anix-$v.apk"
          echo "APK=Anix-$v.apk" >> "$GITHUB_ENV"

      - name: Подпись — наш ключ
        if: env.ANIX_KEYSTORE != ''
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$APK" | tee cert.txt
          grep -q 'CN=Anix' cert.txt || { echo "::error::APK подписан не ключом Anix"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Anix-Android
          path: Anix-*.apk
          retention-days: 14

  # Релиз — из того, что собрано: установщик с latest.yml и .blockmap (Windows) и/или APK (Android). Название — по
  # платформам; текст — сообщение тега
  release:
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [plan, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.windows == 'true'
        with:
          name: Anix-Windows
          path: out
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.android == 'true'
        with:
          name: Anix-Android
          path: out
      - name: Релиз на GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WIN: ${{ needs.plan.outputs.windows }}
          AND: ${{ needs.plan.outputs.android }}
        run: |
          # checkout оставляет тег без аннотации — забираем его целиком, текст релиза берётся из неё
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          v=$(node -p "require('./package.json').version")
          title="Anix $v"
          [ "$WIN" = true ] && [ "$AND" != true ] && title="Anix $v (Windows)"
          [ "$AND" = true ] && [ "$WIN" != true ] && title="Anix $v (Android)"
          ls -la out
          # текст — аннотация тега через git: новые gh не принимают --notes-from-tag вместе с --repo
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || { echo "::error::У тега $GITHUB_REF_NAME нет текста — нужен аннотированный тег (git tag -a … -F notes.md)"; exit 1; }
          gh release create "$GITHUB_REF_NAME" out/* --title "$title" --notes-file notes.md --verify-tag -R "$GITHUB_REPOSITORY"
