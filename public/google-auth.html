<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход через Google — Anix Desktop</title>
  <link rel="icon" href="/icon.png">
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f5; --card: #fff; --text: #212121; --muted: #6b6b6b; --accent: #d32f3f; --err: #c62f3d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121212; --card: #1e1e1e; --text: #eee; --muted: #a8a8a8; --err: #ff8a93; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 15px/1.5 'Segoe UI', system-ui, sans-serif; }
    .card { width: min(380px, calc(100vw - 32px)); padding: 32px 28px; border-radius: 20px; background: var(--card);
      box-shadow: 0 6px 30px rgba(0,0,0,.12); text-align: center; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 6px; }
    p { margin: 0 0 22px; color: var(--muted); }
    button { width: 100%; padding: 13px; border: 0; border-radius: 999px; background: var(--accent); color: #fff;
      font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: var(--err); margin-top: 14px; min-height: 1.5em; }
    a.back { display: block; padding: 13px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon.png" alt="">
    <h1>Вход через Google</h1>
    <p id="sub">Anix Desktop откроет окно Google. После входа вернитесь в приложение.</p>
    <button id="go">Продолжить с Google</button>
    <div class="err" id="err"></div>
  </div>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';

    const q = new URLSearchParams(location.search);
    const n = q.get('n');
    // телефон (LocalServer.kt): после входа — сразу обратно в приложение ссылкой intent:// (MainActivity, singleTask);
    // если браузер не пустит переход без нажатия — кнопка «Вернуться в Anix»
    const android = q.get('app') === 'android';
    const APP = android ? 'Anix' : 'Anix Desktop';
    const BACK = 'intent://auth-done#Intent;scheme=anixdesktop;package=com.arigandores.anix;end';
    document.title = `Вход через Google — ${APP}`;
    const btn = document.getElementById('go');
    const err = document.getElementById('err');
    const sub = document.getElementById('sub');
    sub.textContent = `${APP} откроет окно Google. После входа ${android ? 'приложение откроется само' : 'вернитесь в приложение'}.`;
    const cfg = await (await fetch('/social/google/config')).json();
    const auth = getAuth(initializeApp(cfg));

    btn.onclick = async () => {
      btn.disabled = true; err.textContent = '';
      try {
        const res = await signInWithPopup(auth, new GoogleAuthProvider());
        const idToken = await res.user.getIdToken();
        const r = await (await fetch('/social/google/result', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ n, idToken, email: res.user.email || '' }),
        })).json();
        if (!r.ok) throw new Error('Сеанс входа устарел — начните вход в приложении заново');
        btn.remove();
        if (android) {
          sub.textContent = 'Готово! Возвращаемся в Anix…';
          const a = document.createElement('a'); a.className = 'back'; a.href = BACK; a.textContent = 'Вернуться в Anix';
          sub.after(a);
          location.href = BACK;
        } else {
          sub.textContent = 'Готово! Вернитесь в Anix Desktop — вкладку можно закрыть.';
          setTimeout(() => window.close(), 1500);
        }
      } catch (e) {
        btn.disabled = false;
        if (e && e.code === 'auth/popup-closed-by-user') return;
        err.textContent = e && e.code === 'auth/popup-blocked' ? 'Браузер заблокировал окно Google — разрешите всплывающие окна' : String(e && e.message || e);
      }
    };
  </script>
</body>
</html>
