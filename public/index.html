<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anix</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Тема до отрисовки, чтобы не мигало (Prefs: системная/светлая/тёмная; по умолчанию — тёмная, как store.js DEFAULT_THEME)
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('anixart.theme') || 'dark'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      // своя шапка окна (electron/main.js, js/titlebar.js): место под кнопки окна — с первого кадра, без сдвига
      if (window.anixartNative && window.anixartNative.titlebar) {
        document.documentElement.classList.add('tb');
        if (!matchMedia('(max-width: 720px)').matches) document.documentElement.classList.add('tb-inline');
      }
    })();
  </script>
</head>
<body>
  <div id="titlebar" aria-hidden="true"></div>
  <div id="app">
    <nav id="rail" aria-label="Навигация"></nav>
    <div id="main">
      <div id="viewport"></div>
      <nav id="bottomnav" aria-label="Навигация"></nav>
    </div>
  </div>
  <script src="/vendor/hls.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
